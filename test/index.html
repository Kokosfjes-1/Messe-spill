<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dodge</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
  .logo { --h: clamp(16px, 3.6vmin, 44px); position: fixed; top: 16px; left: 16px; z-index: 2; pointer-events: none; }
  /* crop away the empty padding in the source image (960x367, text ≈ x30–930, y108–258) */
  .logo .crop { position: relative; overflow: hidden; height: var(--h); width: calc(var(--h) * 6); }
  .logo img { position: absolute; width: calc(var(--h) * 6.4); left: calc(var(--h) * -0.2); top: calc(var(--h) * -0.72); }
  #test-banner { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; z-index: 4; padding: 8px 12px; border-radius: 8px; background: #ffd23f; color: #171300; font: 700 12px system-ui, sans-serif; text-align: center; }
  #test-banner a { color: inherit; margin-left: 8px; }
  /* score form shown after each run */
  #submit { position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
            padding: 16px; background: rgba(5,7,12,0.6); font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #e6edf3; }
  #submit[hidden] { display: none; }
  #submit form { box-sizing: border-box; width: min(420px, 100%); background: #151a24; border: 1px solid #2a3242; border-radius: 16px;
                 padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; user-select: text; -webkit-user-select: text; }
  #submit .time { font-size: 56px; font-weight: 900; line-height: 1; color: #fff; }
  #submit .verdict { color: #ffd23f; font-weight: 600; margin: 8px 0 20px; }
  #submit p { margin: 0 0 12px; color: #b6c0cf; font-size: 15px; }
  #submit input[type=tel], #submit input[type=text] { width: 100%; box-sizing: border-box; font-size: 22px; padding: 12px 14px; border-radius: 10px;
                            border: 1px solid #3a4558; background: #0b0d12; color: #fff; text-align: center; letter-spacing: 1px; }
  #submit input[type=text] { font-size: 18px; letter-spacing: 0; margin-bottom: 10px; }
  #submit input[type=tel]:focus, #submit input[type=text]:focus { outline: 2px solid #5ef2c2; border-color: transparent; }
  #submit label { display: flex; gap: 10px; align-items: flex-start; text-align: left; font-size: 13px; color: #9aa6b8; margin: 14px 0 18px; cursor: pointer; }
  #submit label input { width: 20px; height: 20px; flex: none; margin: 0; accent-color: #5ef2c2; }
  #submit .buttons { display: flex; gap: 10px; }
  #submit button { flex: 1; font: inherit; font-weight: 700; font-size: 16px; padding: 13px; border-radius: 10px; border: 0; cursor: pointer; }
  #submit button.primary { background: #5ef2c2; color: #062018; }
  #submit button.ghost { background: transparent; color: #b6c0cf; border: 1px solid #3a4558; }
  #submit button:disabled { opacity: 0.5; cursor: default; }
  #submit .status { min-height: 20px; margin-top: 12px; font-size: 14px; color: #ffd23f; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="logo"><div class="crop"><img src="/img/ikomm.png" alt="IKOMM"></div></div>
<div id="test-banner" hidden>TESTMODUS · Kun lokale testresultater <a href="/">Avslutt</a></div>
<div id="submit" hidden>
  <form novalidate>
    <div class="time" id="s-time">0.0s</div>
    <div class="verdict" id="s-verdict"></div>
    <p>Skriv inn telefonnummeret ditt for å være med i konkurransen. Vi kontakter vinneren.</p>
    <input type="text" id="s-tag" autocomplete="off" placeholder="Navn eller tag (vises på topp 3, valgfritt)" maxlength="16">
    <input type="tel" id="s-phone" inputmode="tel" autocomplete="off" placeholder="Telefonnummer" maxlength="20">
    <label><input type="checkbox" id="s-consent"> Jeg godtar at telefonnummeret mitt lagres slik at vinneren kan kontaktes. Det slettes etter messen og vises aldri på skjermen.</label>
    <div class="buttons">
      <button type="button" class="ghost" id="s-skip">Hopp over</button>
      <button type="submit" class="primary" id="s-send">Send inn</button>
    </div>
    <div class="status" id="s-status"></div>
  </form>
</div>
<script>
// The independently editable /test/ copy uses local data only. Keep these guards
// when promoting it to index.html: the URL determines which environment runs.
const TEST_MODE = /^\/test(?:\/|$)/.test(location.pathname);
const STORAGE_PREFIX = TEST_MODE ? 'dodge-test-' : 'dodge-';
document.getElementById('test-banner').hidden = !TEST_MODE;
if (TEST_MODE) document.title = 'Dodge – testmodus';

// ---------------- TUNING ----------------
// All distances are in "units": 1 unit = 1% of the shorter screen side,
// so difficulty is the same on a phone and on a big booth monitor.
const CFG = {
  graceTime: 1.5,          // seconds before first enemy
  playerRadius: 2.0,
  playerMaxSpeed: 70,      // units/sec – capped so you can't teleport away
  keyboardSpeed: 70,       // units/sec when steering with arrow keys / WASD
  hitboxForgiveness: 0.75, // collision uses 75% of drawn size (feels fair)

  // spawn rate (enemies/sec) = base + growth * t^power
  spawnBase: 1.1,
  spawnGrowth: 0.0022,
  spawnPower: 2.0,         // 10s ≈ 1.3/s, 30s ≈ 3.1/s, 60s ≈ 9/s

  // enemy speed (units/sec) = base * (1 + t / speedDoubleTime)
  enemySpeedBase: 24,
  speedDoubleTime: 48,     // 48s → 2x speed, 60s → 2.25x

  aimedShare: 0.65,        // fraction of enemies aimed at you (rest cross randomly)
  aimSpread: 0.35,         // radians of random error on aimed shots
  dartsFrom: 20,           // after this many seconds, fast "darts" appear
  dartChance: 0.15,
  burstsFrom: 35,          // after this, occasional fan bursts
  burstEvery: 6,           // seconds between bursts
};
// ----------------------------------------

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, U, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  W = innerWidth; H = innerHeight; U = Math.min(W, H) / 100;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let best = 0;
try { best = parseFloat(localStorage.getItem(STORAGE_PREFIX + 'best')) || 0; } catch (e) {}

let state = 'menu'; // menu | countdown | play | over
let t = 0, spawnAcc = 0, burstTimer = 0, overAt = 0, newBest = false;
let enemies = [], particles = [];
const player = { x: 0, y: 0, tx: 0, ty: 0 };
const keys = {};
let countdownAt = 0, message = '', messageUntil = 0, nearMissUntil = 0;
let demo = false, lastActivity = performance.now(), shakeUntil = 0, deathFlashUntil = 0;
const ATTRACT_DELAY = 30000;
const prefersTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

// Sandbox tools: ppa4 during a game. Independent test version: ppa5.
const SECRET = 'ppa4';
let typed = '', sandbox = false, paused = false, timeScale = 1, showHitboxes = true, freezeTime = false, frozen = false, hits = 0, fps = 60;
const TIME_SCALES = [0.1, 0.25, 0.5, 1, 2];

function enterSandbox() {
  sandbox = true; paused = false; timeScale = 1; showHitboxes = true; freezeTime = false; frozen = false; hits = 0;
}
function exitSandbox() {
  sandbox = false; paused = false; state = 'menu'; enemies = []; particles = []; t = 0;
}

function sandboxKey(k) {
  if (k === ' ') paused = !paused;
  else if (k === 'h') showHitboxes = !showHitboxes;
  else if (k === 'f') frozen = !frozen;
  else if (k === 't') freezeTime = !freezeTime;
  else if (k === 'c') enemies = [];
  else if (k === 'b') burst();
  else if (k === 'x') spawn('dart');
  else if (k === 'n') spawn('normal');
  else if (k === 'r') hits = 0;
  else if (k === '+' || k === '=') t += 10;
  else if (k === '-') t = Math.max(0, t - 10);
  else if (k === '[' || k === ']') {
    const i = TIME_SCALES.indexOf(timeScale) + (k === ']' ? 1 : -1);
    timeScale = TIME_SCALES[Math.max(0, Math.min(TIME_SCALES.length - 1, i))];
  }
  else if (k === 'escape') exitSandbox();
}

function reset() {
  applySettings(); // difficulty from /admin only changes between runs
  t = 0; spawnAcc = 0; burstTimer = 0; enemies = []; particles = [];
  player.x = player.tx = W / 2; player.y = player.ty = H / 2;
  state = 'countdown'; countdownAt = performance.now(); newBest = false;
  message = ''; nearMissUntil = 0; demo = false;
}

function startDemo() {
  reset();
  demo = true;
  countdownAt = performance.now() - 3000;
  state = 'play';
}

function registerActivity() { lastActivity = performance.now(); }

// ---------- input ----------
let pointerType = 'mouse', lastTouch = null;
function releaseControls() {
  lastTouch = null;
  for (const key of Object.keys(keys)) keys[key] = false;
}
addEventListener('blur', releaseControls);
addEventListener('pointercancel', releaseControls);
document.addEventListener('visibilitychange', () => {
  releaseControls();
  last = performance.now(); // Returning to the tab must not create a giant frame.
});
cv.addEventListener('pointerdown', e => {
  registerActivity();
  if (demo) { reset(); return; }
  pointerType = e.pointerType;
  lastTouch = { x: e.clientX, y: e.clientY };
  if (state === 'menu') reset();
  else if (state === 'over' && performance.now() - overAt > 900) reset();
  if (pointerType === 'mouse') { player.tx = e.clientX; player.ty = e.clientY; }
});
cv.addEventListener('pointermove', e => {
  registerActivity();
  pointerType = e.pointerType;
  if (e.pointerType === 'mouse') { player.tx = e.clientX; player.ty = e.clientY; }
  else if (lastTouch) {
    // touch: relative drag so your finger never hides the player
    player.tx += (e.clientX - lastTouch.x) * 1.3;
    player.ty += (e.clientY - lastTouch.y) * 1.3;
    lastTouch = { x: e.clientX, y: e.clientY };
  }
});
addEventListener('pointerup', () => { lastTouch = null; });
addEventListener('keydown', e => {
  if (formOpen) return;
  registerActivity();
  if (demo) { reset(); return; }
  const k = e.key.toLowerCase();
  if (k === ' ') e.preventDefault();
  keys[k] = true;
  typed = (typed + k).slice(-SECRET.length);
  if (typed === 'ppa5') {
    location.assign(TEST_MODE ? '/' : '/test/');
    return;
  }
  if (typed === SECRET && state === 'play') {
    typed = '';
    sandbox ? exitSandbox() : enterSandbox();
    return;
  }
  if (sandbox && state === 'play') { if (!e.repeat) sandboxKey(k); return; }
  if ((e.key === ' ' || e.key === 'Enter') && (state === 'menu' || (state === 'over' && performance.now() - overAt > 900))) reset();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------- difficulty ----------
const spawnRate = t => CFG.spawnBase + CFG.spawnGrowth * Math.pow(t, CFG.spawnPower);
const enemySpeed = t => CFG.enemySpeedBase * (1 + t / CFG.speedDoubleTime);

function edgePoint() {
  const m = 4 * U, side = Math.random() * 4 | 0;
  if (side === 0) return { x: Math.random() * W, y: -m };
  if (side === 1) return { x: W + m, y: Math.random() * H };
  if (side === 2) return { x: Math.random() * W, y: H + m };
  return { x: -m, y: Math.random() * H };
}

function spawn(kind) {
  const p = edgePoint();
  let ang;
  if (kind === 'dart' || Math.random() < CFG.aimedShare) {
    ang = Math.atan2(player.y - p.y, player.x - p.x) + (Math.random() - 0.5) * 2 * CFG.aimSpread * (kind === 'dart' ? 0.4 : 1);
  } else {
    // aim at a random point in the middle area so it crosses the screen
    const tx = W * (0.2 + Math.random() * 0.6), ty = H * (0.2 + Math.random() * 0.6);
    ang = Math.atan2(ty - p.y, tx - p.x);
  }
  const dart = kind === 'dart';
  const sp = enemySpeed(t) * U * (dart ? 1.9 : 0.8 + Math.random() * 0.4);
  enemies.push({
    x: p.x, y: p.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
    r: (dart ? 1.2 : 1.5 + Math.random() * 1.3) * U, dart, born: t, warning: 0.5,
  });
}

function burst() {
  const p = edgePoint();
  const base = Math.atan2(player.y - p.y, player.x - p.x);
  const n = 5, gap = 0.22, sp = enemySpeed(t) * U * 0.9;
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * gap;
    enemies.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 1.6 * U, dart: false, burst: true, born: t, warning: 0.5 });
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (dt > 0) fps += (1 / dt - fps) * 0.05;
  if (!document.hidden) {
    if (state === 'menu' && now - lastActivity > ATTRACT_DELAY) startDemo();
    if (state === 'countdown') {
      updatePlayer(dt);
      if (now - countdownAt >= 3000) {
        state = 'play'; last = now;
        showMessage('KJØR!', 650);
      }
    } else if (state === 'play') {
      if (!(sandbox && paused)) update(dt);
    }
    else updateParticles(dt);
  }
  draw(now);
  requestAnimationFrame(frame);
}

function updatePlayer(dt) {
  if (demo) {
    // Seek the safest of a handful of moving targets for an unattended demo.
    let bestPoint = { x: W / 2, y: H / 2 }, bestClearance = -1;
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2 + t * 0.35;
      const candidate = { x: W / 2 + Math.cos(a) * W * 0.32, y: H / 2 + Math.sin(a) * H * 0.32 };
      const clearance = enemies.reduce((min, e) => Math.min(min, Math.hypot(candidate.x - e.x, candidate.y - e.y)), Infinity);
      if (clearance > bestClearance) { bestClearance = clearance; bestPoint = candidate; }
    }
    player.tx = bestPoint.x; player.ty = bestPoint.y;
  }

  // keyboard moves the target at a fixed speed
  const kx = (keys['arrowright'] || keys['d'] ? 1 : 0) - (keys['arrowleft'] || keys['a'] ? 1 : 0);
  const ky = (keys['arrowdown'] || keys['s'] ? 1 : 0) - (keys['arrowup'] || keys['w'] ? 1 : 0);
  if (kx || ky) {
    const l = Math.hypot(kx, ky);
    player.tx += kx / l * CFG.keyboardSpeed * U * dt;
    player.ty += ky / l * CFG.keyboardSpeed * U * dt;
  }

  const pr = CFG.playerRadius * U;
  player.tx = Math.max(pr, Math.min(W - pr, player.tx));
  player.ty = Math.max(pr, Math.min(H - pr, player.ty));
  const dx = player.tx - player.x, dy = player.ty - player.y, d = Math.hypot(dx, dy);
  const maxStep = CFG.playerMaxSpeed * U * dt;
  if (d > maxStep) { player.x += dx / d * maxStep; player.y += dy / d * maxStep; }
  else { player.x = player.tx; player.y = player.ty; }
}

function update(dt) {
  const worldFrozen = sandbox && frozen; // enemies, spawns and clock stop; you can still move
  const previousT = t;
  if (!(sandbox && freezeTime) && !worldFrozen) t += dt;
  updatePlayer(dt * (sandbox ? timeScale : 1));

  if (previousT < CFG.dartsFrom && t >= CFG.dartsFrom) showMessage('DARTS INCOMING', 1800);
  if (previousT < CFG.burstsFrom && t >= CFG.burstsFrom) showMessage('BURST MODE', 1800);

  // spawning
  if (t > CFG.graceTime && !worldFrozen) {
    spawnAcc += spawnRate(t) * dt;
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      spawn(t > CFG.dartsFrom && Math.random() < CFG.dartChance ? 'dart' : 'normal');
    }
    if (t > CFG.burstsFrom) {
      burstTimer += dt;
      if (burstTimer >= CFG.burstEvery) { burstTimer = 0; burst(); }
    }
  }

  // move enemies, collide
  const m = 10 * U;
  for (const e of enemies) {
    if (!worldFrozen) { e.x += e.vx * dt; e.y += e.vy * dt; e.warning = Math.max(0, (e.warning || 0) - dt); }
    const distance = Math.hypot(e.x - player.x, e.y - player.y);
    const hitDistance = (e.r + pr) * CFG.hitboxForgiveness;
    if (distance < hitDistance) {
      if (!sandbox) return die();
      if (!e.hit) { e.hit = true; hits++; }
      e.flash = 0.3;
    } else if (!e.nearMiss && e.closestDistance < hitDistance + 2.2 * U && distance > e.closestDistance) {
      e.nearMiss = true;
      nearMissUntil = performance.now() + 450;
      for (let i = 0; i < 7; i++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * 18 * U, vy: Math.sin(a) * 18 * U, life: 0.45, color: '#ffffff', size: 2 });
      }
    }
    e.closestDistance = Math.min(e.closestDistance ?? Infinity, distance);
    if (e.flash) e.flash = Math.max(0, e.flash - dt);
  }
  enemies = enemies.filter(e => e.x > -m && e.x < W + m && e.y > -m && e.y < H + m);
  updateParticles(dt);
}

function showMessage(value, duration) {
  message = value;
  messageUntil = performance.now() + duration;
}

function die() {
  if (demo) {
    state = 'menu'; demo = false; enemies = []; particles = []; t = 0;
    lastActivity = performance.now() - ATTRACT_DELAY + 5000;
    return;
  }
  state = 'over'; overAt = performance.now();
  shakeUntil = overAt + 500; deathFlashUntil = overAt + 180;
  releaseControls();
  if (t > best) { best = t; newBest = true; try { localStorage.setItem(STORAGE_PREFIX + 'best', best); } catch (e) {} }
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, s = (20 + Math.random() * 60) * U;
    particles.push({ x: player.x, y: player.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color: i % 3 ? '#5ef2c2' : '#ffffff', size: 3 + Math.random() * 4 });
  }
  setTimeout(openForm, 1200);
}

function updateParticles(dt) {
  const drag = Math.pow(0.94, dt * 60);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= drag; p.vy *= drag; p.life -= dt * 1.2; }
  particles = particles.filter(p => p.life > 0);
}

// ---------- drawing ----------
function stageColor(t) {
  // calm blue → purple → red as it gets harder
  if (t < 60) {
    const k = t / 60;
    return `hsl(${225 - 225 * k}, 45%, ${7 + k * 4}%)`;
  }
  // past the minute: red that pulses faster the longer you last
  const pulse = 0.5 + 0.5 * Math.sin(t * (4 + (t - 60) * 0.1));
  return `hsl(0, ${45 + pulse * 20}%, ${11 + pulse * 5}%)`;
}

function text(str, x, y, size, color, weight = 700) {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}

function draw(now) {
  const shaking = now < shakeUntil;
  ctx.save();
  if (shaking) {
    const strength = 7 * (shakeUntil - now) / 500;
    ctx.translate((Math.random() - 0.5) * strength * 2, (Math.random() - 0.5) * strength * 2);
  }
  ctx.fillStyle = state === 'menu' ? '#0b0d12' : stageColor(t);
  ctx.fillRect(-12, -12, W + 24, H + 24);

  // Subtle moving grid makes speed and difficulty easier to feel.
  const grid = Math.max(30, 8 * U), offset = (t * 12) % grid;
  ctx.strokeStyle = `rgba(120,155,205,${state === 'menu' ? 0.035 : 0.055 + Math.min(t, 60) / 1200})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = offset; x < W; x += grid) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = offset; y < H; y += grid) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // enemies
  for (const e of enemies) {
    if (e.warning > 0) {
      const wx = Math.max(12, Math.min(W - 12, e.x));
      const wy = Math.max(12, Math.min(H - 12, e.y));
      ctx.globalAlpha = Math.min(1, e.warning * 3);
      ctx.strokeStyle = e.dart ? '#ffd23f' : e.burst ? '#ff7ad9' : '#ff4d5e';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(wx, wy, 7 + 5 * Math.sin(now / 70), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = e.flash ? '#ffffff' : e.dart ? '#ffd23f' : e.burst ? '#ff7ad9' : '#ff4d5e';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    if (e.dart) { // little trail so darts read as fast
      ctx.strokeStyle = 'rgba(255,210,63,0.35)'; ctx.lineWidth = e.r;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x - e.vx * 0.08, e.y - e.vy * 0.08); ctx.stroke();
    }
  }

  // player
  if (state === 'play' || state === 'countdown') {
    // cursor dot + line to it, so you can see where the ball is heading when it lags behind the mouse
    if (Math.hypot(player.tx - player.x, player.ty - player.y) > U) {
      ctx.strokeStyle = 'rgba(94,242,194,0.3)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.tx, player.ty); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(player.tx, player.ty, 0.6 * U, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill();

    ctx.beginPath(); ctx.arc(player.x, player.y, CFG.playerRadius * U, 0, Math.PI * 2);
    ctx.fillStyle = '#5ef2c2'; ctx.shadowColor = '#5ef2c2'; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
  }
  if (sandbox && state === 'play') drawSandbox();
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    const size = p.size || 3;
    ctx.fillStyle = p.color || '#5ef2c2'; ctx.fillRect(p.x - size, p.y - size, size * 2, size * 2);
  }
  ctx.globalAlpha = 1;

  const S = Math.min(W, H);
  if (state === 'countdown') {
    const left = Math.max(1, 3 - Math.floor((now - countdownAt) / 1000));
    text(String(left), W / 2, H / 2, S * 0.22, '#fff', 900);
    text(prefersTouch ? 'Dra hvor som helst for å bevege deg' : 'Bruk musen eller WASD / piltastene', W / 2, H / 2 + S * 0.15, S * 0.032, 'rgba(255,255,255,0.7)', 500);
  } else if (state === 'play' && sandbox) {
    text('SANDBOX', W / 2, S * 0.06, S * 0.04, '#ffd23f', 800);
  } else if (state === 'play') {
    text(fmt(t), W / 2, S * 0.09, S * 0.09, 'rgba(255,255,255,0.9)');
    if (best > 0) text(`rekord ${fmt(best)}`, W / 2, S * 0.16, S * 0.03, 'rgba(255,255,255,0.45)', 500);
    if (demo) text('DEMO · BERØR ELLER TRYKK FOR Å SPILLE', W / 2, H - S * 0.08, S * 0.03, '#ffd23f', 800);
    if (now < messageUntil) {
      const alpha = Math.min(1, (messageUntil - now) / 300);
      text(message, W / 2, H / 2, S * 0.075, `rgba(255,210,63,${alpha})`, 900);
    }
    if (now < nearMissUntil) {
      const alpha = (nearMissUntil - now) / 450;
      text('NÆRE PÅ!', W / 2, H / 2 + S * 0.1, S * 0.035, `rgba(255,255,255,${alpha})`, 800);
    }
  } else if (state === 'menu') {
    text('DODGE', W / 2, H / 2 - S * 0.24, S * 0.14, '#fff', 900);
    text('Beveg deg. Ikke bli truffet.', W / 2, H / 2 - S * 0.1, S * 0.045, 'rgba(255,255,255,0.8)', 500);
    text('Hvor lenge kan du overleve?', W / 2, H / 2 - S * 0.03, S * 0.035, '#ffd23f', 600);
    const pulse = 0.5 + 0.5 * Math.sin(now / 300);
    text(prefersTouch ? 'trykk for å starte · dra for å bevege deg' : 'klikk / mellomrom for å starte · mus eller WASD', W / 2, H / 2 + S * 0.08, S * 0.03, `rgba(255,255,255,${0.4 + pulse * 0.5})`, 500);
    if (top3.length) {
      text('TOPP 3', W / 2, H / 2 + S * 0.2, S * 0.03, 'rgba(255,255,255,0.5)', 800);
      const medal = ['#ffd23f', '#d6dde8', '#e0995e'];
      top3.forEach((r, i) => text(`${i + 1}.  ${fmt(r.time)} s${r.tag ? '   ' + r.tag : ''}`, W / 2, H / 2 + S * (0.26 + i * 0.055), S * 0.04, medal[i], 800));
    }
  } else if (state === 'over' && !formOpen) {
    text(fmt(t) + ' s', W / 2, H / 2 - S * 0.08, S * 0.16, '#fff', 900);
    text(verdict(t), W / 2, H / 2 + S * 0.05, S * 0.045, '#ffd23f', 600);
    text(newBest ? 'NY REKORD!' : `rekord ${fmt(best)} s`, W / 2, H / 2 + S * 0.12, S * 0.035, newBest ? '#5ef2c2' : 'rgba(255,255,255,0.6)', 600);
    if (performance.now() - overAt > 900) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 300);
      text('trykk for å spille igjen', W / 2, H / 2 + S * 0.24, S * 0.03, `rgba(255,255,255,${0.4 + pulse * 0.5})`, 500);
    }
  }

  // Vignette and impact flash sit above the world while keeping the UI readable.
  const vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, `rgba(0,0,0,${state === 'play' ? 0.28 : 0.4})`);
  ctx.fillStyle = vignette; ctx.fillRect(-12, -12, W + 24, H + 24);
  if (now < deathFlashUntil) {
    ctx.fillStyle = `rgba(255,255,255,${(deathFlashUntil - now) / 180 * 0.75})`;
    ctx.fillRect(-12, -12, W + 24, H + 24);
  }
  ctx.restore();
}

function drawSandbox() {
  const f = CFG.hitboxForgiveness, pr = CFG.playerRadius * U;
  if (showHitboxes) {
    ctx.lineWidth = 1.5;
    // collision happens when two dashed circles touch
    ctx.setLineDash([4, 3]);
    for (const e of enemies) {
      ctx.strokeStyle = e.hit ? '#ffffff' : '#7fd1ff';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r * f, 0, Math.PI * 2); ctx.stroke();
      // velocity: where it will be in 0.5s
      ctx.strokeStyle = 'rgba(127,209,255,0.35)';
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.vx * 0.5, e.y + e.vy * 0.5); ctx.stroke();
    }
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(player.x, player.y, pr * f, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    // where the player is heading (target), shows speed-cap lag
    ctx.strokeStyle = 'rgba(94,242,194,0.5)';
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.tx, player.ty); ctx.stroke();
    ctx.beginPath(); ctx.arc(player.tx, player.ty, 4, 0, Math.PI * 2); ctx.stroke();
  }

  const lines = [
    `tid         ${t.toFixed(1)}s${freezeTime ? '  (låst)' : ''}`,
    `spawnrate   ${spawnRate(t).toFixed(2)}/s`,
    `fiendefart  ${enemySpeed(t).toFixed(1)} u/s  (du: ${CFG.playerMaxSpeed})`,
    `darts       ${t > CFG.dartsFrom ? 'på' : 'fra ' + CFG.dartsFrom + 's'}`,
    `bursts      ${t > CFG.burstsFrom ? 'på' : 'fra ' + CFG.burstsFrom + 's'}`,
    `fiender     ${enemies.length}`,
    `treff       ${hits}`,
    `spillfart   ${timeScale}x${paused ? '  PAUSE' : ''}${frozen ? '  FRYST' : ''}`,
    `fps         ${fps.toFixed(0)}`,
    ``,
    `mellomrom pause  [ ] spillfart`,
    `F frys verden (du kan bevege deg)`,
    `+ / -  tid ±10s   T lås tid`,
    `N fiende  X dart  B burst  C tøm`,
    `H hitbokser  R nullstill treff`,
    `Esc eller ppa4  avslutt`,
  ];
  const size = Math.max(11, Math.min(14, U * 1.6)), lh = size * 1.45;
  // top-right, so it doesn't cover the logo
  const pw = size * 22, px = W - pw - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(px, 10, pw, lines.length * lh + 16);
  ctx.font = `500 ${size}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = '#e6edf3';
  lines.forEach((l, i) => ctx.fillText(l, px + 8, 18 + i * lh));
}

// ---------- scores (Azure API) ----------
// Runs are queued in localStorage first, so nothing is lost if the booth wifi drops.
const API = '/api';
let top3 = [], formOpen = false;
const $ = id => document.getElementById(id);

if (TEST_MODE) {
  $('submit').querySelector('p').textContent = 'Testrunde – resultatet lagres bare i denne nettleseren.';
  $('s-phone').hidden = true;
  $('s-consent').closest('label').hidden = true;
  // The form's label uses display:flex, so explicitly hide it in test mode.
  $('s-consent').closest('label').style.display = 'none';
  $('s-send').textContent = 'Lagre test';
}

function normalizePhone(raw) { // same rules as api/src/shared.js
  let p = raw.replace(/[\s\-().]/g, '');
  if (p.startsWith('00')) p = '+' + p.slice(2);
  if (/^\d{8}$/.test(p)) p = '+47' + p;
  return /^\+\d{8,15}$/.test(p) ? p : null;
}

function loadPending() { try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'pending')) || []; } catch (e) { return []; } }
function savePending(list) { try { localStorage.setItem(STORAGE_PREFIX + 'pending', JSON.stringify(list)); } catch (e) {} }

// returns true if everything queued has reached the server; only one flush runs at a time
let flushing = null;
function flushPending() { return flushing || (flushing = doFlush().finally(() => { flushing = null; })); }
async function doFlush() {
  if (TEST_MODE) return true; // Never send test runs or flush the competition queue.
  let list = loadPending();
  while (list.length) {
    try {
      const res = await fetch(`${API}/score`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(list[0]) });
      if (!res.ok && res.status !== 400) return false; // server trouble: keep it, retry later
    } catch (e) { return false; }                       // offline: keep it, retry later
    list = loadPending().slice(1); savePending(list);   // sent (or rejected as invalid): drop it
  }
  return true;
}

// ---------- difficulty from /admin ----------
const DEFAULTS = { ...CFG };
let remoteSettings = null;
try { remoteSettings = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'settings')); } catch (e) {}

function applySettings() {
  Object.assign(CFG, DEFAULTS);
  for (const [k, v] of Object.entries(remoteSettings || {})) {
    if (k in DEFAULTS && typeof v === 'number' && Number.isFinite(v)) CFG[k] = v;
  }
  CFG.keyboardSpeed = CFG.playerMaxSpeed;
}

async function loadSettings() {
  if (TEST_MODE) return; // Test tuning lives in this copy's CFG, independent of /admin.
  try {
    const res = await fetch(`${API}/settings`, { cache: 'no-store' });
    if (!res.ok) return;
    remoteSettings = (await res.json()).values;
    try { localStorage.setItem(STORAGE_PREFIX + 'settings', JSON.stringify(remoteSettings)); } catch (e) {}
    if (state !== 'play') applySettings();
  } catch (e) {} // offline: keep the last known settings
}

async function loadTop() {
  if (TEST_MODE) {
    try { top3 = JSON.parse(localStorage.getItem(STORAGE_PREFIX + 'top')) || []; } catch (e) { top3 = []; }
    return;
  }
  try {
    const res = await fetch(`${API}/top`, { cache: 'no-store' });
    if (res.ok) top3 = await res.json();
  } catch (e) {}
}

function openForm() {
  if (state !== 'over') return;
  formOpen = true;
  $('s-time').textContent = fmt(t) + ' s';
  $('s-verdict').textContent = verdict(t);
  $('s-phone').value = ''; $('s-tag').value = ''; $('s-consent').checked = false;
  $('s-status').textContent = '';
  $('s-send').disabled = $('s-skip').disabled = false;
  $('submit').hidden = false;
  $('s-tag').focus();
}

function closeForm() {
  $('s-phone').value = ''; $('s-tag').value = ''; // never leave the previous player's details on screen
  $('submit').hidden = true;
  formOpen = false;
  state = 'menu'; enemies = []; particles = [];
  registerActivity();
  loadTop(); loadSettings();
}

$('s-skip').addEventListener('click', closeForm);
$('submit').querySelector('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (TEST_MODE) {
    const tag = $('s-tag').value.trim().slice(0, 16);
    const results = [...top3, { time: Math.round(t * 100) / 100, tag }]
      .sort((a, b) => b.time - a.time).slice(0, 3);
    try {
      localStorage.setItem(STORAGE_PREFIX + 'top', JSON.stringify(results));
    } catch (err) {
      $('s-status').textContent = 'Kunne ikke lagre testresultatet i nettleseren.';
      return;
    }
    top3 = results;
    $('s-send').disabled = $('s-skip').disabled = true;
    $('s-status').textContent = 'Testresultat lagret lokalt.';
    setTimeout(closeForm, 1400);
    return;
  }
  const phone = normalizePhone($('s-phone').value);
  if (!phone) { $('s-status').textContent = 'Skriv inn et gyldig telefonnummer.'; return; }
  const tag = $('s-tag').value.trim();
  if (/\d{5,}/.test(tag.replace(/[\s\-().+]/g, ''))) { $('s-status').textContent = 'Ikke skriv telefonnummeret i taggen – den vises på skjermen.'; return; }
  if (!$('s-consent').checked) { $('s-status').textContent = 'Kryss av i boksen for å være med i konkurransen.'; return; }
  $('s-send').disabled = $('s-skip').disabled = true;
  $('s-status').textContent = 'Lagrer …';
  savePending([...loadPending(), { phone, tag, time: Math.round(t * 100) / 100, consent: true }]);
  const sent = await flushPending();
  $('s-status').textContent = sent ? 'Lagret – lykke til!' : 'Lagret på denne enheten, sendes når nettet er tilbake.';
  setTimeout(closeForm, 1400);
});

applySettings();
flushPending().then(loadTop);
loadSettings();
setInterval(() => { if (state !== 'play') { flushPending().then(loadTop); loadSettings(); } }, 60000);

// Norwegian number format: 23,4
const fmt = n => n.toFixed(1).replace('.', ',');

function verdict(t) {
  if (t < 10) return 'Oppvarming …';
  if (t < 20) return 'Ikke verst!';
  if (t < 30) return 'Solid!';
  if (t < 40) return 'Imponerende!';
  if (t < 50) return 'Elitereflekser!';
  if (t < 60) return 'Så nær legendarisk!';
  if (t < 75) return 'LEGENDARISK – du slo minuttet!';
  if (t < 90) return 'Er du i det hele tatt et menneske?';
  return 'Helt uvirkelig.';
}

requestAnimationFrame(frame);
</script>
